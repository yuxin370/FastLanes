# ────────────────────────────────────────────────────────
# |                      FastLanes                       |
# ────────────────────────────────────────────────────────
# .github/actions/install-llvm/action.yml
# ────────────────────────────────────────────────────────
# .github/actions/install-llvm-toolchain/action.yml
name: Install LLVM Toolchain
description: Cross-platform LLVM installer for macOS, Ubuntu and Windows

inputs:
  version:
    description: "Latest stable LLVM release, or a release version (major or major.minor.patch)"
    default: "23"

runs:
  using: "composite"
  steps:
    - shell: bash
      env:
        LLVM_REQUEST: ${{ inputs.version }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        VERSION="$LLVM_REQUEST"
        if [[ "$VERSION" == latest ]]; then
          tag=$(gh api repos/llvm/llvm-project/releases/latest --jq .tag_name)
          VERSION="${tag#llvmorg-}"
        elif [[ "$VERSION" =~ ^[0-9]+$ ]]; then
          # Pick a stable patch release from the requested major.
          tag=$(git ls-remote --tags --refs https://github.com/llvm/llvm-project.git "llvmorg-$VERSION.*" |
            awk -F/ '$NF ~ /^llvmorg-[0-9]+\.[0-9]+\.[0-9]+$/ { print $NF }' | sort -t. -k2,2n -k3,3n | tail -1)
          VERSION="${tag#llvmorg-}"
        fi
        if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::Could not resolve a stable LLVM release for $LLVM_REQUEST"
          exit 1
        fi
        MAJOR="${VERSION%%.*}"
        echo "Installing LLVM $VERSION on $RUNNER_OS"

        if [[ "$RUNNER_OS" == macOS ]]; then
          formula=llvm
          if [[ "$LLVM_REQUEST" != latest ]] && brew info "llvm@${MAJOR}" >/dev/null 2>&1; then
            formula="llvm@${MAJOR}"
          fi
          brew install "$formula"
          LLVM_BIN="$(brew --prefix "$formula")/bin"

          # ── 2. Reclaim disk space so large static libs fit ───────────────────
          echo "🧹 Freeing disk space on macOS runner …"
          # Remove .NET (~6 GB) and Haskell (~3 GB)
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc         || true
          # Delete cached iOS / tvOS simulators & Android SDK (~4 GB)
          sudo rm -rf "$HOME/Library/Developer/CoreSimulator" || true
          sudo rm -rf "$HOME/Library/Android"                 || true
          # Remove old Homebrew download caches (~2 GB)
          brew cleanup -s      || true
          rm -rf "$(brew --cache)" || true
          df -h

        elif [[ "$RUNNER_OS" == Linux ]]; then
          # ── Ubuntu LTS ────────────────────────────────────────────────────────
          sudo apt-get update -y
          sudo apt-get install -y wget gnupg lsb-release software-properties-common
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | \
            sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/llvm.gpg

          UBUNTU_CODENAME=$(lsb_release -cs)
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] \
            https://apt.llvm.org/${UBUNTU_CODENAME}/ \
            llvm-toolchain-${UBUNTU_CODENAME}-${MAJOR} main" | \
            sudo tee /etc/apt/sources.list.d/llvm${MAJOR}.list

          sudo apt-get update -y
          sudo apt-get install -y clang-${MAJOR} clang-tidy-${MAJOR} lld-${MAJOR} libclang-rt-${MAJOR}-dev

          LLVM_BIN="/usr/lib/llvm-${MAJOR}/bin"

        elif [[ "$RUNNER_OS" == Windows ]]; then
          case "$RUNNER_ARCH" in
            X64)   arch=x86_64 ;;
            ARM64) arch=aarch64 ;;
            *) echo "::error::Unsupported Windows architecture $RUNNER_ARCH"; exit 1 ;;
          esac
          asset="clang+llvm-${VERSION}-${arch}-pc-windows-msvc.tar.xz"
          tag="llvmorg-$VERSION"
          dest="$(cygpath -u "$RUNNER_TEMP")/llvm-$VERSION"
          mkdir -p "$dest"
          gh release download "$tag" --repo llvm/llvm-project --pattern "$asset" --dir "$dest"
          digest=$(gh api "repos/llvm/llvm-project/releases/tags/$tag" |
            jq -er --arg name "$asset" '.assets[] | select(.name == $name) | .digest | strings | select(startswith("sha256:"))')
          (
            cd "$dest"
            echo "${digest#sha256:}  $asset" | sha256sum -c -
            tar -xf "$asset" --strip-components=1
            rm "$asset"
          )
          LLVM_BIN="$dest/bin"
        else
          echo "::error::Unsupported runner OS $RUNNER_OS"
          exit 1
        fi

        actual=$("$LLVM_BIN/clang" -dumpversion)
        if [[ ! "$LLVM_REQUEST" =~ ^[0-9]+$ && "$actual" != "$VERSION" ]] || [[ "${actual%%.*}" != "$MAJOR" ]]; then
          echo "::error::Requested LLVM $LLVM_REQUEST ($VERSION), found $actual"
          exit 1
        fi
        "$LLVM_BIN/clang" --version
        if [[ "$RUNNER_OS" == Windows ]]; then
          cygpath -w "$LLVM_BIN" >> "$GITHUB_PATH"
        else
          echo "$LLVM_BIN" >> "$GITHUB_PATH"
        fi
