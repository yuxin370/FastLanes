# ────────────────────────────────────────────────────────
# |                      FastLanes                       |
# ────────────────────────────────────────────────────────
# .github/workflows/fsst.yaml
# ────────────────────────────────────────────────────────
name: FSST
run-name: >-
  ${{ github.workflow }} on ${{ github.ref_name }} (#${{ github.run_number }})
  — ${{ github.event.pull_request.title || github.event.head_commit.message }}

# ──────────────────────────────────────────────────────────────────────────────
# Events
# ──────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

# Cancel in-flight runs on the same branch/PR so we do not waste minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Global env (tweak once, use everywhere)
env:
  CMAKE_GENERATOR: Ninja            # much faster than Makefiles

jobs:
  # ──────────────────────────────────────────────────────────────────────────────
  # 2️⃣  Main build + clang-tidy (Linux + macOS)
  # ──────────────────────────────────────────────────────────────────────────────
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [ ubuntu-24.04, macos-latest ]
        build_type: [ Release ]
        cxx: [ clang++ ]
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Detect CPU count
        shell: bash
        run: make detect-cpu | tee -a "$GITHUB_ENV"

      - name: Install LLVM
        uses: ./.github/actions/install-llvm

      # ----------------------------------------------------------------------
      # Configure FSST benchmarks and tests
      # ----------------------------------------------------------------------
      - name: Generate FSST test data
        run: make generate_synthetic_data

      - name: Configure FSST
        shell: bash
        run: |
          cmake -S "${{ github.workspace }}" \
                -B build_${{ matrix.build_type }} \
                -DFLS_ENABLE_VERBOSE_OUTPUT=ON \
                -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
                -DCMAKE_C_COMPILER=clang \
                -DCMAKE_GTEST_DISCOVER_TESTS_DISCOVERY_MODE=PRE_TEST \
                -DFLS_ENABLE_FSST_TESTING_AND_BENCHMARKING=ON \
                -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

      - name: Build FSST
        run: cmake --build build_${{ matrix.build_type }} -j $BUILD_THREADS

      - name: Run FSST tests
        run: ctest --test-dir build_${{ matrix.build_type }}/fsst/benchmarks --parallel "$BUILD_THREADS" --no-tests=error --output-on-failure
