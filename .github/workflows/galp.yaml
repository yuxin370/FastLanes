# ────────────────────────────────────────────────────────
# |                      FastLanes                       |
# ────────────────────────────────────────────────────────
# .github/workflows/galp.yaml
# ────────────────────────────────────────────────────────
# .github/workflows/galp.yml

name: GALP

run-name: >-
  ${{ github.workflow }} on ${{ github.ref_name }} (#${{ github.run_number }})
  — ${{ github.event.pull_request.title || github.event.head_commit.message }}

on:
  pull_request:
  push:

permissions:
  contents: read

# Each run step starts a fresh shell. Activate the runner's CUDA environment
# for every step, including the independent PR and Torch jobs.
defaults:
  run:
    shell: bash .github/galp-ci-shell.sh {0}

jobs:
  pr-public-api:
    if: >-
      ${{
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository
      }}
    name: GALP public API and package smoke
    runs-on:
      - self-hosted
      - Linux
      - X64
      - president

    steps:
      - name: Checkout source
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: Verify build tools
        run: |
          for cmd in nvcc clang++ g++ cmake make python3; do
            command -v "$cmd" >/dev/null || { echo "::error::$cmd missing"; exit 127; }
          done

      - name: CMake configure
        run: |
          set -x
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_COMPILER="$(command -v nvcc)" \
            -DPython3_EXECUTABLE="$(command -v python3)" \
            -DFLS_ENABLE_GALP_TESTING_AND_BENCHMARKING=ON \
            -DGALP_BUILD_TESTS=ON \
            -DGALP_BUILD_TOOLS=ON \
            -DGALP_BUILD_BENCHMARKS=OFF \
            -DGALP_WITH_NVCOMP=OFF

      - name: Build public smoke targets
        run: >
          cmake --build build --parallel
          --target
          galp_core
          galp_tests
          galp_cuda_transfer_failure_tests
          galp_compact_format_tests
          galp_direct_dct_contract_tests
          galp_native_logical_batch_pipeline_tests
          galp_jpeg_dct_decode_memory_tests
          galp_jpeg_dct_exact_verifier_tests
          galp_block_major_access_tests
          galp_direct_dct_pls_tests
          galp_public_api_smoke
          galp_api_boundary_checks
          galp_cli

      - name: Public API tests
        run: ctest --test-dir build -L public-api --no-tests=error --output-on-failure --timeout 300

      - name: CPU and static tests
        run: |
          discovered=$(ctest --test-dir build -N)
          for test in CompactSegment GPUArray DevicePool DirectDctShadowContract NativeLogicalBatchPipeline PublicDirectDctApiPython CudaTransferFailure; do
            grep -F "$test" <<< "$discovered" || exit 1
          done
          ctest --test-dir build -j4 -L 'cpu|static' --no-tests=error --output-on-failure --timeout 300

      - name: Package consumer smoke
        run: ctest --test-dir build -R GalpPackageConsumerSmoke --no-tests=error --output-on-failure --timeout 300

  gpu-build-test:
    if: ${{ github.event_name == 'push'}}
    name: GALP GPU build and tests
    runs-on:
      - self-hosted
      - Linux
      - X64
      - president

    steps:
      # ────────────────────────────────────────────────
      # 0. Checkout
      # ────────────────────────────────────────────────
      - name: Checkout source
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      # ────────────────────────────────────────────────
      # 1. Quick sanity of the runner
      # ────────────────────────────────────────────────
      - name: Verify tools
        run: |
          for cmd in nvidia-smi nvcc clang++ g++ cmake make python3; do
            command -v "$cmd" >/dev/null || { echo "::error::$cmd missing"; exit 127; }
          done

      - name: Env dump
        run: |
          set -x
          hostname
          echo "Runner label: president"
          echo "CUDA path: $CUDA_LIBRARY_PATH"
          echo "NVCOMP_INC: $NVCOMP_INC"
          echo "NVCOMP_LIB: $NVCOMP_LIB"
          echo "HOME: $HOME"
          nvidia-smi
          nvcc --version
          clang++ --version
          g++ --version
          cmake --version
          make --version

      - name: Generate GALP CSV fixtures only
        run: |
          python3 -m venv "$RUNNER_TEMP/galp-fixture-venv"
          "$RUNNER_TEMP/galp-fixture-venv/bin/python" -m pip install Faker
          PYTHONPATH="$PWD/scripts" "$RUNNER_TEMP/galp-fixture-venv/bin/python" - <<'PY'
          import random
          from generator_helpers.galp_generator import fls_galp
          random.seed(11997733)
          fls_galp()
          PY

      - name: CMake configure
        run: |
          set -x
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_COMPILER="$(command -v nvcc)" \
            -DPython3_EXECUTABLE="$(command -v python3)" \
            -DFLS_ENABLE_GALP_TESTING_AND_BENCHMARKING=ON \
            -DGALP_BUILD_TESTS=ON \
            -DGALP_BUILD_TOOLS=ON \
            -DGALP_BUILD_BENCHMARKS=OFF \
            -DGALP_WITH_NVCOMP=OFF
          cmake -LA -N build | grep -E '^(CMAKE_BUILD_TYPE|GALP_BUILD_TESTS|GALP_BUILD_TOOLS|GALP_BUILD_BENCHMARKS|GALP_WITH_NVCOMP|FLS_ENABLE_GALP_TESTING_AND_BENCHMARKING):'

      - name: Build GALP targets
        run: >
          cmake --build build --parallel
          --target
          galp_core
          galp_tests
          galp_cuda_transfer_failure_tests
          galp_compact_format_tests
          galp_direct_dct_contract_tests
          galp_native_logical_batch_pipeline_tests
          galp_jpeg_dct_decode_memory_tests
          galp_jpeg_dct_exact_verifier_tests
          galp_block_major_access_tests
          galp_direct_dct_pls_tests
          galp_public_api_smoke
          galp_api_boundary_checks
          galp_cli

      - name: Public API tests
        run: ctest --test-dir build -L public-api --no-tests=error --output-on-failure --timeout 300

      - name: CPU and static tests
        run: |
          discovered=$(ctest --test-dir build -N)
          for test in CompactSegment GPUArray DevicePool DirectDctShadowContract NativeLogicalBatchPipeline PublicDirectDctApiPython CudaTransferFailure; do
            grep -F "$test" <<< "$discovered" || exit 1
          done
          ctest --test-dir build -j4 -L 'cpu|static' --no-tests=error --output-on-failure --timeout 300

      - name: Build host ownership TSAN tests
        run: |
          cmake -S . -B build-tsan \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER="$(command -v clang++)" \
            -DCMAKE_CUDA_COMPILER="$(command -v nvcc)" \
            -DPython3_EXECUTABLE="$(command -v python3)" \
            -DFLS_ENABLE_GALP_TESTING_AND_BENCHMARKING=ON \
            -DFLS_ENABLE_TSAN=ON \
            -DGALP_BUILD_TESTS=ON -DGALP_BUILD_TOOLS=OFF \
            -DGALP_BUILD_BENCHMARKS=OFF -DGALP_WITH_NVCOMP=OFF \
            -DGALP_BUILD_TORCH=OFF
          cmake --build build-tsan --parallel 4 --target galp_cuda_transfer_failure_tests

      - name: Host ownership TSAN (not CUDA driver instrumentation)
        timeout-minutes: 5
        run: |
          TSAN_OPTIONS=halt_on_error=1 build-tsan/galp/tests/galp_cuda_transfer_failure_tests \
            --gtest_repeat=30 --gtest_brief=1

      - name: Verify CUDA tests can run
        run: |
          gpu_count=$(nvidia-smi --query-gpu=index --format=csv,noheader | wc -l)
          echo "Visible GPUs: $gpu_count. Single-GPU CI passing does not validate multi-GPU ownership."
          if [ "$gpu_count" -lt 2 ]; then
            echo "::notice::Multi-GPU tests will skip; multi-GPU behavior is NOT verified by this run."
          fi
          result=$(build/galp/tests/galp_tests --gtest_filter=DevicePool.GPUArrayReleasesFailedCopy)
          echo "$result"
          grep -Fq '[  PASSED  ] 1 test.' <<< "$result"

      - name: GPU tests
        run: |
          ctest --test-dir build -j4 -R 'GPUArray|DevicePool' --no-tests=error --output-on-failure --timeout 300
          ctest --test-dir build -j4 -L gpu --no-tests=error --output-on-failure --timeout 300

      - name: Upload CTest logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: galp-ctest-logs
          path: |
            build/Testing/**/*.log
            build/Testing/Temporary/*
          if-no-files-found: ignore

  torch-gpu-smoke:
    if: ${{ github.event_name == 'push' }}
    name: Native Torch extension and CUDA runtime smoke
    runs-on: [self-hosted, Linux, X64, president]
    env:
      GALP_REQUIRE_CUDA_SMOKE: '1'
      GALP_DIRECT_DCT_TEST_BATCH_SIZE: '2'
      GALP_DIRECT_DCT_TEST_MANIFEST: ${{ github.workspace }}/build-torch/smoke-data/manifest.bin
    steps:
      - uses: actions/checkout@v3
      - name: Require CUDA PyTorch and fixture dependencies
        run: |
          for cmd in nvidia-smi nvcc clang++ g++ cmake make python3; do
            command -v "$cmd" >/dev/null || { echo "::error::$cmd missing"; exit 127; }
          done
          nvidia-smi
          python3 -c "import torch; import PIL; assert torch.version.cuda, 'CPU-only PyTorch'; assert torch.cuda.is_available(), 'CUDA unavailable'; print(torch.__version__, torch.cuda.get_device_name(0))"
      - name: Configure native Torch binding
        run: |
          cmake -S . -B build-torch \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_COMPILER="$(command -v nvcc)" \
            -DFLS_ENABLE_GALP_TESTING_AND_BENCHMARKING=ON \
            -DGALP_BUILD_TESTS=ON -DGALP_BUILD_TOOLS=ON \
            -DGALP_BUILD_BENCHMARKS=OFF -DGALP_WITH_NVCOMP=OFF \
            -DGALP_BUILD_TORCH=ON -DPython3_EXECUTABLE="$(command -v python3)"
      - name: Build native extension and fixture encoder
        run: cmake --build build-torch --parallel --target _galp_direct_dct galp_jpeg_dct_tool galp_block_major_access_tool
      - name: Create a small real JPEG manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          source = Path('build-torch/smoke-jpegs')
          source.mkdir(parents=True, exist_ok=True)
          for index in range(2):
              pixels = bytes((x * (y + 17) + channel * 53 + index * 31) % 256
                             for y in range(512) for x in range(512) for channel in range(3))
              Image.frombytes('RGB', (512, 512), pixels).save(source / f'{index}.jpg')
          PY
          build-torch/galp/tools/jpeg_dct/galp_jpeg_dct_tool \
            --shard --out-dir build-torch/smoke-data --preset balanced \
            --physical-layout image-major-vector-rowgroups --spatial-order tiled-z-32 \
            --metadata-profile reconstruct build-torch/smoke-jpegs
          test -f "$GALP_DIRECT_DCT_TEST_MANIFEST"
      - name: Run native import and GPU runtime tests (skips are failures)
        run: |
          for test in GalpDirectDctTorchImport GalpDirectDctTorchRuntimeSmoke GalpDirectDctPlsTorchRuntimeSmoke; do
            ctest --test-dir build-torch -R "^${test}$" --no-tests=error --output-on-failure --timeout 300
          done
      - name: Upload Torch test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: galp-torch-ctest-logs
          path: build-torch/Testing/Temporary/*
          if-no-files-found: ignore
