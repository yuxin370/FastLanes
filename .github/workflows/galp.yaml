# |                      FastLanes                       |
# ────────────────────────────────────────────────────────
# .github/workflows/galp.yaml
# ────────────────────────────────────────────────────────
# .github/workflows/galp.yml

name: GALP

run-name: >-
  ${{ github.workflow }} on ${{ github.ref_name }} (#${{ github.run_number }})
  — ${{ github.event.pull_request.title || github.event.head_commit.message }}

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  pr-public-api:
    if: >-
      ${{
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository
      }}
    name: GALP public API and package smoke
    runs-on:
      - self-hosted
      - Linux
      - X64
      - president

    steps:
      - name: Checkout source
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: CMake configure
        run: |
          set -x
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DFLS_ENABLE_GALP_TESTING_AND_BENCHMARKING=ON \
            -DGALP_BUILD_TESTS=ON \
            -DGALP_BUILD_TOOLS=ON \
            -DGALP_BUILD_BENCHMARKS=OFF \
            -DGALP_WITH_NVCOMP=OFF

      - name: Build public smoke targets
        run: >
          cmake --build build --parallel
          --target
          galp_core
          galp_public_api_smoke
          galp_api_boundary_checks
          galp_cli

      - name: Public API tests
        run: ctest --test-dir build -L public-api --output-on-failure

      - name: Package consumer smoke
        run: ctest --test-dir build -R GalpPackageConsumerSmoke --output-on-failure

  gpu-build-test:
    if: ${{ github.event_name == 'push'}}
    name: GALP GPU build and tests
    runs-on:
      - self-hosted
      - Linux
      - X64
      - president

    steps:
      # ────────────────────────────────────────────────
      # 0. Checkout
      # ────────────────────────────────────────────────
      - name: Checkout source
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # ────────────────────────────────────────────────
      # 0a. Generate synthetic dataset
      # ────────────────────────────────────────────────
      - name: Generate synthetic dataset
        uses: ./.github/actions/generate-dataset

      # ────────────────────────────────────────────────
      # 1. Quick sanity of the runner
      # ────────────────────────────────────────────────
      - name: Env dump
        run: |
          set -x
          hostname
          echo "Runner label: president"
          echo "CUDA path: $CUDA_LIBRARY_PATH"
          echo "NVCOMP_INC: $NVCOMP_INC"
          echo "NVCOMP_LIB: $NVCOMP_LIB"
          nvidia-smi
          nvcc --version
          clang++ --version
          g++ --version
          cmake --version
          make --version

      - name: Verify tools
        run: |
          for cmd in nvidia-smi nvcc clang++ g++ cmake make; do
            command -v "$cmd" >/dev/null || { echo "::error::$cmd missing"; exit 127; }
          done

      - name: CMake configure
        run: |
          set -x
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DFLS_ENABLE_GALP_TESTING_AND_BENCHMARKING=ON \
            -DGALP_BUILD_TESTS=ON \
            -DGALP_BUILD_TOOLS=ON \
            -DGALP_BUILD_BENCHMARKS=OFF \
            -DGALP_WITH_NVCOMP=OFF
          cmake -LA -N build | grep -E '^(CMAKE_BUILD_TYPE|GALP_BUILD_TESTS|GALP_BUILD_TOOLS|GALP_BUILD_BENCHMARKS|GALP_WITH_NVCOMP|FLS_ENABLE_GALP_TESTING_AND_BENCHMARKING):'

      - name: Build GALP targets
        run: >
          cmake --build build --parallel
          --target
          galp_core
          galp_tests
          galp_public_api_smoke
          galp_api_boundary_checks
          galp_cli

      - name: Public API tests
        run: ctest --test-dir build -L public-api --output-on-failure

      - name: GPU tests
        run: ctest --test-dir build -L gpu --output-on-failure

      - name: Upload CTest logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: galp-ctest-logs
          path: |
            build/Testing/**/*.log
            build/Testing/Temporary/*
          if-no-files-found: ignore
