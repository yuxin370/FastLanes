# Proposed configuration vocabulary; this is not an existing FastLens API.
# This template is deliberately NOT runnable. Resolve every required null from
# repository/source artifacts, materialize the resolved contract, then hash it.
schema_version: "0.1-draft"
document_kind: proposed_matched_dct_contract
status: planned
comparison_scope: source_representation_matched

execution:
  enabled: false
  missing_values_policy: fail_closed
  allow_guessed_defaults: false
  allow_timing_before_correctness_gate: false
  immutable_resolved_contract_required: true
  preflight_must_verify:
    - required_artifacts_exist_and_hashes_match
    - profile_and_trace_resolve_all_tensor_semantics
    - source_frequency_dependencies_have_evidence
    - model_batch_precision_and_tail_policy_imported_from_repository
    - every_enabled_method_passes_source_and_tensor_equivalence
    - cache_time_and_resource_budgets_are_explicit

artifacts:
  repository:
    path: null
    revision: null
  source_manifest:
    path: null
    sha256: null
  model_profile:
    path: null
    sha256: null
  request_trace:
    path: null
    sha256: null
  checkpoint_or_initial_training_snapshot:
    path: null
    sha256: null
  source_oracle_evidence:
    path: null
    sha256: null
  transform_dependency_evidence:
    path: null
    sha256: null
  numerical_tolerance_contract:
    path: null
    sha256: null

source:
  representation: original_jpeg_quantized_dct
  jpeg_block_shape: [8, 8]
  extract_existing_coefficients_without_pixel_roundtrip: true
  original_q_values_must_be_exact: true
  original_quantization_tables_must_be_exact: true
  preserve_component_sampling_geometry_and_padding: true
  source_manifest_must_record:
    - image_id_and_label
    - source_jpeg_sha256
    - dataset_split_and_image_order
    - imagenet_512_preprocessing_recipe_and_encoder_settings
    - dimensions_component_sampling_and_padding
    - component_quantization_table_references
    - coefficient_order_and_zigzag_to_uv_mapping
  forbidden_offline_changes:
    - rgb_decode_then_recompute_dct
    - requantize_or_apply_uniform_q50
    - rounding_clipping_or_saturation_of_source_q
    - bake_in_crop_resize_flip_or_model_normalization
  unsupported_source_handling: explicit_error_no_silent_reencoding

profile:
  resolution_source: repository_model_profile
  source_frequencies:
    # Resolve the actual component-specific sets, not only their cardinalities.
    per_component_uv: null
    dependency_derivation: null
    dependency_evidence_artifact: transform_dependency_evidence
    infer_from_model_name_or_output_channel_count: forbidden
    silently_default_to_all_64: forbidden
  output_channels:
    per_tensor_component_and_order: null
    must_be_separate_from_source_frequencies: true
  tensors:
    names_shapes_layouts_and_dtypes: null
  transforms:
    crop_resize_flip_augmentation_and_mixup_semantics: null
    dequantization_clamp_round_normalization_order: null
    geometry_boundaries_and_resize_dependency_closure: null
  # IC's native triangle parameter k=B keeps B*(B+1)/2 coefficients.
  # A B8 full-64 or irregular mask is a matched-adapter extension, not a
  # native IC "k=8" candidate. Full-64 is valid only when explicitly resolved.
  source_mask_semantics: explicit_uv_set_not_native_triangle_parameter

logical_workload:
  trace_is_materialized_and_replayed: true
  random_seed_alone_is_not_sufficient: true
  required_trace_fields:
    - occurrence_id
    - image_id
    - logical_slot
    - epoch
    - crop_and_resize_parameters
    - flip_and_augmentation_parameters
    - mixup_pair_occurrence_id_and_lambda
    - profile_id
  run_kind: null # input_only | inference | training_epoch
  sample_count_and_split: null
  policy_name: null
  policy_evidence_path: null
  model_microbatch_size:
    import_from_repository_key: null
    resolved_value: null
  model_precision:
    import_from_repository_key: null
    resolved_value: null
  tail_padding_drop_last_and_gradient_normalization:
    import_from_repository_key: null
    resolved_value: null
  training_optimizer_lr_accumulation_and_update_count:
    required_for: training_epoch
    resolved_value: null
  policy_sensitivity_traces:
    segment_locality_policy_path: null
    independent_per_sample_policy_path: null

methods:
  cpu_dct:
    role: jpeg_source_coefficient_reference
    runtime_transform_contract: common_profile
  fastlens:
    role: repository_implementation
    implementation_entrypoint: null
    runtime_transform_contract: common_profile
  ic_matched_shared:
    attribution: paper_guided_jpeg_dct_adapter
    storage_unit: one_image
    codec: numpy_npz_zip_deflate
    stored_q_dtype: int32
    numpy_allow_pickle: false
    stored_mask: all_source_coefficients
    runtime_transform_contract: common_profile
    include_geometry_quantization_tables_and_labels: true
    full_or_irregular_mask_is_explicit_adapter_extension: true
  ic_matched_fixedk:
    attribution: paper_guided_jpeg_dct_adapter
    storage_unit: one_image
    codec: numpy_npz_zip_deflate
    stored_q_dtype: int32
    numpy_allow_pickle: false
    stored_mask: resolved_profile_source_frequency_dependency_closure
    retain_all_source_spatial_positions: true
    require_dependency_evidence_before_pruning: true
    per_profile_copies_and_conversion_costs_must_be_counted: true
    no_new_rounding_or_quantization: true
    runtime_transform_contract: common_profile
  ic_matched_batched:
    attribution: paper_guided_jpeg_dct_adapter_with_explicit_batch_schema
    storage_unit: image_major_group
    storage_group_images: 256
    codec: numpy_npz_zip_deflate
    stored_q_dtype: int32
    numpy_allow_pickle: false
    numeric_payload_members: one_concatenated_payload_with_offsets
    exact_member_layout_is_engineering_choice: true
    separate_per_image_member_bundle_must_have_its_own_variant_label: true
    stored_mask: explicit_full_or_proved_fixedk
    retain_all_source_spatial_positions: true
    runtime_transform_contract: common_profile
  fs_matched_b8:
    attribution: paper_guided_jpeg_dct_adapter
    jpeg_block_shape: [8, 8]
    column_rule: d_equals_u_plus_v
    diagonal_count: 15
    storage_group_images: 256
    column_scope: all_images_and_spatial_blocks_in_storage_group
    codec: numpy_npz_zip_deflate
    numpy_allow_pickle: false
    allowed_q_dtypes: [int8, int16]
    dtype_selection: smallest_signed_type_that_preserves_all_column_values
    dtype_range_check_before_cast: required
    overflow_policy: reject_strict_variant_do_not_clip
    serialization_order_and_component_offsets: null
    read_rule: union_of_touched_whole_diagonals_and_storage_groups
    exact_frequency_image_and_spatial_gather_is_timed: true
    decoded_cache_hit: reuse_without_redecoding
    compressed_cache_hit: decode_once_and_share_within_the_allowed_budget
    miss: fetch_full_column_then_decode_once
    npz_files: one_file_per_storage_group_and_diagonal
    coefficient_members_per_npz: one_contiguous_numeric_array
    implicit_scalar_columns_or_spatial_index: forbidden
    runtime_transform_contract: common_profile
  enhanced_controls:
    include_in_paper_guided_baseline_label: false
    examples_requiring_separate_variant:
      - zstd_reencoding
      - gpu_decompression_for_npz
      - scalar_frequency_columns_or_spatial_index
      - wider_integer_fallback_for_out_of_range_fs_columns
  native_reproduction:
    enabled_in_this_contract: false
    requires_separate_contract_and_results_table: true
    # Native B32/Q50 and native IC triangular search parameters belong only
    # in that separate contract; they must not flow into this matched source.

implementation_choices_to_resolve_and_record:
  npz_array_names_and_order: null
  deflate_level_and_zlib_numpy_versions: null
  metadata_index_geometry_and_label_serialization: null
  cpu_decode_parallelism_and_transport_dtype_per_method: null
  equivalent_native_inflate_reader_variant_if_used: null

resource_budget:
  gpu_and_cpu_platform: null
  cpu_core_allocation_and_numa_policy: null
  maximum_host_memory_bytes: null
  maximum_pinned_memory_bytes: null
  maximum_pipeline_gpu_memory_bytes: null
  preparation_pool_size_per_method: null
  in_flight_pools_per_method: null
  workers_and_prefetch_per_method: null
  tuning_trials_per_method: null
  equal_budget_tuning_and_async_overlap_allowed_for_all_methods: true
  storage_group_is_not_model_microbatch: true

measurement:
  measurement_mode: null # actual | emulated | modeled; warmth is recorded in cache_mode
  cache_mode: null # cold_verified | file_warm | decoded_host | gpu_resident
  cache_verification_evidence_path: null
  cuda_and_worker_warmup_policy: null
  measured_data_must_not_be_prepared_before_start_boundary: true
  wall_clock_includes_first_request_and_final_cuda_completion: true
  common_trace_parse_may_be_shared_before_timing: true
  backend_planning_coalescing_and_byte_range_construction_are_timed: true
  input_only_boundary: request_submission_to_all_final_cuda_tensors_ready
  inference_boundary: request_submission_to_last_model_output_complete
  training_boundary: request_submission_to_last_required_optimizer_update_complete
  report_startup_and_steady_state_separately: true
  formal_runs_exclude_profiler_instrumentation: true
  repetitions_minimum: 3
  report_median_dispersion_and_raw_runs: true
  synthetic_bandwidth_or_delay_specification: null
  modeled_time_is_never_labeled_measured_end_to_end: true
  required_accounting:
    - compressed_payload_and_metadata_application_read_bytes
    - physical_storage_read_bytes_or_explicit_unmeasured_null
    - complete_h2d_including_indices_labels_tables_and_padding
    - requested_and_physically_decoded_q_values
    - all_storage_metadata_indices_and_per_profile_copies
    - host_pinned_and_gpu_peak_memory
    - method_specific_offline_conversion_and_search_costs

gates:
  q_and_quantization_tables: exact_equality
  profile_source_dependency_closure: verified_against_full_source_oracle
  final_tensors: tolerance_contract_and_operation_order_verified
  inference: full_validation_ids_logits_and_accuracy_evidence
  training: short_update_equivalence_before_full_epoch
  full_epoch: exact_occurrence_order_tail_policy_and_optimizer_update_count
  publication: failed_or_unverified_matched_results_are_ineligible
